<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>板書レコーダー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --wall:#cdd5dc; --chrome:#f4f6f8; --ink:#1e2b37; --muted:#5f6f7e; --line:#d3dae0;
  --btn:#ffffff; --on:#1e2b37; --onInk:#ffffff; --rec:#c8261f; --frame:#aeb7bf;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --wall:#262d34; --chrome:#1b2127; --ink:#e6ebf0; --muted:#9aa7b3; --line:#38424c;
    --btn:#252d35; --on:#e6ebf0; --onInk:#1b2127; --rec:#ef4a40; --frame:#4a545e;
  }
}
:root[data-theme="dark"]{
  --wall:#262d34; --chrome:#1b2127; --ink:#e6ebf0; --muted:#9aa7b3; --line:#38424c;
  --btn:#252d35; --on:#e6ebf0; --onInk:#1b2127; --rec:#ef4a40; --frame:#4a545e;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--chrome)}
body{height:100%;margin:0;background:var(--chrome);color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overflow:hidden}
#app{height:100%;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto 1fr}
header{grid-column:1/3;display:flex;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.grp{display:flex;align-items:center;gap:4px}
.sep{flex:1}
button{font:inherit;color:var(--ink);background:var(--btn);border:1px solid var(--line);border-radius:10px;
  min-width:44px;height:44px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  touch-action:manipulation;cursor:pointer}
button:disabled{opacity:.35}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#pageLabel{min-width:64px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
#recBtn{background:var(--rec);color:#fff;border-color:transparent;font-weight:700;padding:0 16px}
#recBtn .dot{width:12px;height:12px;border-radius:50%;background:#fff}
#recBtn.live .dot{border-radius:2px}
select{font:inherit;color:var(--ink);background:var(--btn);border:1px solid var(--line);border-radius:10px;height:44px;padding:0 10px}
select:disabled{opacity:.4}
button.danger{background:var(--rec);color:#fff;border-color:transparent;font-weight:700}
#recTime{font-variant-numeric:tabular-nums;font-weight:700;min-width:52px;color:var(--rec)}
aside{display:flex;flex-direction:column;gap:6px;padding:10px 8px;border-right:1px solid var(--line);overflow-y:auto}
aside .tool{flex-direction:column;height:58px;width:60px;gap:2px;font-size:11px;padding:0}
aside .tool[aria-pressed="true"],button.toggle[aria-pressed="true"]{background:var(--on);color:var(--onInk);border-color:var(--on)}
aside hr{border:0;border-top:1px solid var(--line);margin:4px 2px;width:auto}
.cap{width:60px;height:36px;border-radius:8px;padding:0;position:relative}
.cap span{display:block;width:34px;height:14px;border-radius:7px;background:var(--c)}
.cap[aria-pressed="true"]{border:2px solid var(--ink)}
.size{width:60px;height:36px;padding:0}
.size{gap:6px;justify-content:flex-start;padding-left:12px}
.size i{display:block;border-radius:50%;background:currentColor;flex:none}
.size b{font-size:12px;font-weight:500}
.size[aria-pressed="true"]{border:2px solid var(--ink)}
main{position:relative;background:var(--wall);display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none;padding:14px}
#board{display:block;background:#fff;border-radius:6px;box-shadow:0 0 0 7px var(--frame),0 10px 30px rgba(0,0,0,.18);touch-action:none}
#countdown{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:120px;font-weight:700;color:#fff;
  background:rgba(20,28,36,.45);pointer-events:none}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--chrome);
  padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1}
dialog{border:none;border-radius:16px;padding:18px;background:var(--chrome);color:var(--ink);max-width:min(92vw,820px);width:100%}
dialog::backdrop{background:rgba(10,14,18,.55)}
dialog video{width:100%;border-radius:8px;background:#000;display:block}
dialog h2{font-size:18px;margin:0 0 12px}
dialog .row{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
dialog .primary{background:var(--on);color:var(--onInk);border-color:var(--on);font-weight:700}
dialog p{font-size:14px;color:var(--muted);margin:10px 0 0;line-height:1.7}
.hide{display:none!important}
@media (prefers-reduced-motion: reduce){#toast{transition:none}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="grp">
      <button id="prevBtn" aria-label="前のページ"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <span id="pageLabel">1 / 1</span>
      <button id="nextBtn" aria-label="次のページ"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
      <button id="addBtn" aria-label="ページを追加"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      <button id="delPageBtn" aria-label="このページを削除"><svg viewBox="0 0 24 24"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12"/></svg></button>
    </div>
    <div class="grp">
      <button id="undoBtn" aria-label="元に戻す"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg></button>
      <button id="redoBtn" aria-label="やり直す"><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 000 12h3"/></svg></button>
      <button id="clearBtn">書き込みを消す</button>
    </div>
    <div class="grp">
      <button id="gridBtn" class="toggle" aria-pressed="false">方眼</button>
      <button id="importBtn"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M4 16l5-5 4 4 3-3 4 4"/></svg>PDF・画像</button>
      <input id="file" type="file" accept="image/*,application/pdf" multiple class="hide">
    </div>
    <div class="sep"></div>
    <div class="grp">
      <select id="quality" aria-label="画質">
        <option value="light">軽量 720p</option>
        <option value="std" selected>標準 1080p</option>
        <option value="high">高画質 1080p・60fps</option>
      </select>
      <span id="recTime" class="hide">00:00</span>
      <button id="pauseBtn" class="hide" ><svg viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></svg>一時停止</button>
      <button id="recBtn"><span class="dot"></span><span id="recLabel">録画</span></button>
    </div>
  </header>

  <aside aria-label="道具">
    <button class="tool" data-tool="pen" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M4 20l4-1L19 8l-3-3L5 16z"/><path d="M14 7l3 3"/></svg>ペン</button>
    <button class="tool" data-tool="hl" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M6 20h12"/><path d="M8 16l2-2 7-7-3-3-7 7-1 3z"/></svg>マーカー</button>
    <button class="tool" data-tool="eraser" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M8 20h12"/><path d="M4 15l9-9 6 6-8 8H8z"/></svg>消しゴム</button>
    <button class="tool" data-tool="laser" aria-pressed="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/></svg>レーザー</button>
    <button class="tool" data-tool="move" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M9 6l3-3 3 3M9 18l3 3 3-3M6 9l-3 3 3 3M18 9l3 3-3 3"/></svg>画像移動</button>
    <hr>
    <button class="cap" data-color="#1a1a1a" aria-label="黒" aria-pressed="true" style="--c:#1a1a1a"><span></span></button>
    <button class="cap" data-color="#d62828" aria-label="赤" aria-pressed="false" style="--c:#d62828"><span></span></button>
    <button class="cap" data-color="#1f5fbf" aria-label="青" aria-pressed="false" style="--c:#1f5fbf"><span></span></button>
    <button class="cap hlOnly hide" data-color="#ffd400" aria-label="黄" aria-pressed="false" style="--c:#ffd400"><span></span></button>
    <hr>
    <button class="size" data-size="2.5" aria-label="細" aria-pressed="false"><i style="width:4px;height:4px"></i><b>細</b></button>
    <button class="size" data-size="4.5" aria-label="中" aria-pressed="true"><i style="width:8px;height:8px"></i><b>中</b></button>
    <button class="size" data-size="8" aria-label="太" aria-pressed="false"><i style="width:13px;height:13px"></i><b>太</b></button>
    <hr>
    <button id="delImgBtn" class="tool hide"><svg viewBox="0 0 24 24"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12"/></svg>画像削除</button>
  </aside>

  <main id="stage">
    <canvas id="board"></canvas>
    <div id="countdown"></div>
  </main>
</div>

<div id="toast" role="status"></div>

<dialog id="resultDlg">
  <h2>録画した動画</h2>
  <video id="resultVideo" controls playsinline></video>
  <p id="saveNote" class="hide"></p>
  <div class="row">
    <button id="discardBtn">破棄して閉じる</button>
    <button id="saveBtn" class="primary">動画を保存</button>
  </div>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script>
(() => {
const W = 1920, H = 1080;
const cv = document.getElementById('board');
cv.width = W; cv.height = H;
const ctx = cv.getContext('2d');
const stage = document.getElementById('stage');
const $ = id => document.getElementById(id);

/* ---------- state ---------- */
let pages = [newPage()], cur = 0, grid = false;
let tool = 'pen', penColor = '#1a1a1a', hlColor = '#ffd400', size = 4.5;
let penSeen = false;
let drawing = null, activeId = null;
let erasing = null;
let sel = null, drag = null;
let laser = [];
let needsRender = true, layerDirty = true;
function newPage(){ return { items: [], undo: [], redo: [] }; }
const page = () => pages[cur];

/* ---------- layout ---------- */
let SCALE = 1;
const layer = document.createElement('canvas'); layer.width = W; layer.height = H;
const lctx = layer.getContext('2d');
function fit(){
  const r = stage.getBoundingClientRect();
  const s = Math.min((r.width - 40) / W, (r.height - 40) / H);
  cv.style.width = Math.floor(W * s) + 'px';
  cv.style.height = Math.floor(H * s) + 'px';
  const S = Math.max(1, Math.min(2, Math.round(W * s * (window.devicePixelRatio || 1)) / W));
  if (Math.abs(S - SCALE) > 0.01){
    SCALE = S;
    cv.width = Math.round(W * S); cv.height = Math.round(H * S);
    layer.width = cv.width; layer.height = cv.height;
    ctx.setTransform(S, 0, 0, S, 0, 0); lctx.setTransform(S, 0, 0, S, 0, 0);
    layerDirty = needsRender = true;
  }
}
new ResizeObserver(fit).observe(stage);

/* ---------- images ---------- */
const imgCache = new Map();
function getImg(src){
  let im = imgCache.get(src);
  if (!im){ im = new Image(); im.onload = () => { layerDirty = needsRender = true; }; im.src = src; imgCache.set(src, im); }
  return im;
}

/* ---------- rendering ---------- */

function drawGrid(c){
  c.save(); c.strokeStyle = '#dde6ee'; c.lineWidth = 1;
  for (let x = 40; x < W; x += 40){ c.beginPath(); c.moveTo(x + .5, 0); c.lineTo(x + .5, H); c.stroke(); }
  for (let y = 40; y < H; y += 40){ c.beginPath(); c.moveTo(0, y + .5); c.lineTo(W, y + .5); c.stroke(); }
  c.restore();
}
function smoothPts(p){
  const n = p.length; if (n < 3) return p;
  const o = [p[0]];
  for (let i = 1; i < n - 1; i++){
    const a = p[i-1], b = p[i], c = p[i+1];
    o.push({ x: (a.x + 2*b.x + c.x) / 4, y: (a.y + 2*b.y + c.y) / 4, p: (a.p + 2*b.p + c.p) / 4 });
  }
  o.push(p[n-1]); return o;
}
function curveThrough(c, pts, start){
  if (start) c.moveTo(pts[0].x, pts[0].y); else c.lineTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length - 1; i++){
    const mx = (pts[i].x + pts[i+1].x) / 2, my = (pts[i].y + pts[i+1].y) / 2;
    c.quadraticCurveTo(pts[i].x, pts[i].y, mx, my);
  }
  const L = pts[pts.length-1]; c.lineTo(L.x, L.y);
}
function widthAt(s, p){ return s.hl ? s.size : s.size * (0.35 + p.p * 1.3); }
function drawStroke(c, s){
  const p = s.pts; if (!p.length) return;
  c.save(); c.lineCap = 'round'; c.lineJoin = 'round'; c.strokeStyle = s.color; c.fillStyle = s.color;
  if (s.hl){ c.globalAlpha = .38; c.globalCompositeOperation = 'multiply'; }
  if (p.length === 1){
    c.beginPath(); c.arc(p[0].x, p[0].y, widthAt(s, p[0]) / 2, 0, Math.PI * 2); c.fill(); c.restore(); return;
  }
  if (s.hl){
    c.lineWidth = s.size; c.beginPath(); c.moveTo(p[0].x, p[0].y);
    for (let i = 1; i < p.length - 1; i++){ const mx = (p[i].x + p[i+1].x) / 2, my = (p[i].y + p[i+1].y) / 2; c.quadraticCurveTo(p[i].x, p[i].y, mx, my); }
    c.lineTo(p[p.length-1].x, p[p.length-1].y); c.stroke();
  } else {
    const q = smoothPts(smoothPts(p)), n = q.length;
    const left = [], right = [];
    let nx = 0, ny = 1;
    for (let i = 0; i < n; i++){
      const A = q[Math.max(0, i - 1)], B = q[Math.min(n - 1, i + 1)];
      const dx = B.x - A.x, dy = B.y - A.y, L = Math.hypot(dx, dy);
      if (L > 0.001){ nx = -dy / L; ny = dx / L; }
      const r = widthAt(s, q[i]) / 2;
      left.push({ x: q[i].x + nx * r, y: q[i].y + ny * r });
      right.push({ x: q[i].x - nx * r, y: q[i].y - ny * r });
    }
    right.reverse();
    c.beginPath();
    curveThrough(c, left, true);
    c.lineTo(right[0].x, right[0].y);
    curveThrough(c, right, false);
    c.closePath(); c.fill();
    for (const k of [0, n - 1]){ c.beginPath(); c.arc(q[k].x, q[k].y, widthAt(s, q[k]) / 2, 0, Math.PI * 2); c.fill(); }
  }
  c.restore();
}
function renderLayer(){
  lctx.globalCompositeOperation = 'source-over'; lctx.globalAlpha = 1;
  lctx.fillStyle = '#fff'; lctx.fillRect(0, 0, W, H);
  if (grid) drawGrid(lctx);
  for (const it of page().items){
    if (it.type === 'image'){ const im = getImg(it.src); if (im.complete && im.naturalWidth) lctx.drawImage(im, it.x, it.y, it.w, it.h); }
    else drawStroke(lctx, it);
  }
  layerDirty = false;
}
function render(){
  if (layerDirty) renderLayer();
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(layer, 0, 0); ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);
  if (drawing) drawStroke(ctx, drawing);
  if (sel && tool === 'move'){
    ctx.save(); ctx.strokeStyle = '#1f5fbf'; ctx.lineWidth = 3; ctx.setLineDash([12, 8]);
    ctx.strokeRect(sel.x, sel.y, sel.w, sel.h); ctx.setLineDash([]);
    ctx.fillStyle = '#1f5fbf'; ctx.fillRect(sel.x + sel.w - 18, sel.y + sel.h - 18, 36, 36); ctx.restore();
  }
  if (erasing && erasing.pt){
    ctx.save(); ctx.strokeStyle = 'rgba(30,43,55,.55)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(erasing.pt.x, erasing.pt.y, ERASE_R, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
  }
  const now = performance.now();
  laser = laser.filter(l => now - l.t < 700);
  if (laser.length){
    ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    for (let i = 1; i < laser.length; i++){
      const a = laser[i-1], b = laser[i]; if (b.t - a.t > 120) continue;
      const k = 1 - (now - b.t) / 700;
      ctx.strokeStyle = `rgba(255,40,40,${0.25 * k})`; ctx.lineWidth = 22 * k;
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      ctx.strokeStyle = `rgba(255,30,30,${0.85 * k})`; ctx.lineWidth = 7 * k;
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    }
    const h = laser[laser.length-1];
    if (now - h.t < 700 && laserDown){
      ctx.fillStyle = 'rgba(255,40,40,.3)'; ctx.beginPath(); ctx.arc(h.x, h.y, 20, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ff2a2a'; ctx.beginPath(); ctx.arc(h.x, h.y, 8, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }
}
let laserDown = false;
function loop(){
  if (needsRender || laser.length || recState === 'live'){ render(); needsRender = false; }
  if (recCanvas && recState !== 'idle'){
    rctx.drawImage(cv, 0, 0, recCanvas.width, recCanvas.height);
    const t = performance.now();
    if (recTrack && t - lastFrameT >= 1000 / recFps - 4){ recTrack.requestFrame(); lastFrameT = t; }
  }
  requestAnimationFrame(loop);
}

/* ---------- undo ---------- */
function snapshot(){ const pg = page(); pg.undo.push(pg.items.slice()); if (pg.undo.length > 100) pg.undo.shift(); pg.redo = []; }
function changed(){ layerDirty = needsRender = true; updateUI(); scheduleSave(); }
function undo(){ const pg = page(); if (!pg.undo.length) return; pg.redo.push(pg.items); pg.items = pg.undo.pop(); sel = null; changed(); }
function redo(){ const pg = page(); if (!pg.redo.length) return; pg.undo.push(pg.items); pg.items = pg.redo.pop(); sel = null; changed(); }

/* ---------- pointer ---------- */
const ERASE_R = 22;
function toBoard(e){
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height,
           p: e.pointerType === 'pen' ? Math.max(0.05, e.pressure || 0.5) : 0.5 };
}
function segDist(px, py, a, b){
  const dx = b.x - a.x, dy = b.y - a.y, L = dx*dx + dy*dy;
  let t = L ? ((px - a.x)*dx + (py - a.y)*dy) / L : 0; t = Math.max(0, Math.min(1, t));
  const x = a.x + t*dx, y = a.y + t*dy; return Math.hypot(px - x, py - y);
}
function eraseAt(pt){
  const pg = page(); let hit = false;
  pg.items = pg.items.filter(it => {
    if (it.type !== 'stroke') return true;
    const r = ERASE_R + it.size / 2, p = it.pts;
    if (p.length === 1){ if (Math.hypot(p[0].x - pt.x, p[0].y - pt.y) < r){ hit = true; return false; } return true; }
    for (let i = 1; i < p.length; i++) if (segDist(pt.x, pt.y, p[i-1], p[i]) < r){ hit = true; return false; }
    return true;
  });
  if (hit){ erasing.hit = true; layerDirty = true; }
}
function imageAt(pt){
  const items = page().items;
  for (let i = items.length - 1; i >= 0; i--){
    const it = items[i];
    if (it.type === 'image' && !it.locked && pt.x >= it.x && pt.x <= it.x + it.w && pt.y >= it.y && pt.y <= it.y + it.h) return i;
  }
  return -1;
}

cv.addEventListener('pointerdown', e => {
  if (e.pointerType === 'pen') penSeen = true;
  if (penSeen && e.pointerType === 'touch' && tool !== 'laser' && tool !== 'move') return; // palm rejection
  if (activeId !== null) return;
  e.preventDefault();
  activeId = e.pointerId; cv.setPointerCapture(e.pointerId);
  const pt = toBoard(e);
  if (tool === 'pen' || tool === 'hl'){
    drawing = { type: 'stroke', color: tool === 'hl' ? hlColor : penColor, size: tool === 'hl' ? ({2.5:14,4.5:24,8:38}[size] || 24) : size, hl: tool === 'hl', pts: [pt] };
  } else if (tool === 'eraser'){
    snapshot(); erasing = { hit: false, pt }; eraseAt(pt);
  } else if (tool === 'laser'){
    laserDown = true; laser.push({ x: pt.x, y: pt.y, t: performance.now() });
  } else if (tool === 'move'){
    if (sel && Math.abs(pt.x - (sel.x + sel.w)) < 40 && Math.abs(pt.y - (sel.y + sel.h)) < 40){
      snapshot(); swapSel(); drag = { mode: 'resize', sx: pt.x, sy: pt.y, w: sel.w, h: sel.h, moved: false };
    } else {
      const i = imageAt(pt);
      if (i < 0){ sel = null; updateUI(); }
      else { snapshot(); sel = page().items[i]; swapSel(); drag = { mode: 'move', sx: pt.x, sy: pt.y, x: sel.x, y: sel.y, moved: false }; updateUI(); }
    }
  }
  needsRender = true;
});
function swapSel(){ const items = page().items, i = items.indexOf(sel); const c = { ...sel }; items[i] = c; sel = c; }

cv.addEventListener('pointermove', e => {
  if (e.pointerId !== activeId) return;
  const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  if (drawing){ for (const ev of (evs.length ? evs : [e])){ const pt = toBoard(ev); const L = drawing.pts[drawing.pts.length-1]; if (Math.hypot(pt.x - L.x, pt.y - L.y) > 0.6){ pt.p = L.p * 0.65 + pt.p * 0.35; drawing.pts.push(pt); } } }
  else if (erasing){ for (const ev of (evs.length ? evs : [e])) { erasing.pt = toBoard(ev); eraseAt(erasing.pt); } }
  else if (tool === 'laser'){ for (const ev of (evs.length ? evs : [e])){ const pt = toBoard(ev); laser.push({ x: pt.x, y: pt.y, t: performance.now() }); } }
  else if (drag && sel){
    const pt = toBoard(e); drag.moved = true;
    if (drag.mode === 'move'){ sel.x = drag.x + pt.x - drag.sx; sel.y = drag.y + pt.y - drag.sy; }
    else { const r = drag.h / drag.w; const w = Math.max(60, drag.w + pt.x - drag.sx); sel.w = w; sel.h = w * r; }
    layerDirty = true;
  }
  needsRender = true;
});
function endPointer(e){
  if (e.pointerId !== activeId) return;
  activeId = null;
  if (drawing){ snapshot(); page().items.push(drawing); drawing = null; changed(); }
  else if (erasing){ if (!erasing.hit) page().undo.pop(); else changed(); erasing = null; }
  else if (drag){ if (!drag.moved){ page().undo.pop(); } else changed(); drag = null; }
  laserDown = false; needsRender = true;
}
cv.addEventListener('pointerup', endPointer);
cv.addEventListener('pointercancel', endPointer);
stage.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

/* ---------- toolbar ---------- */
document.querySelectorAll('[data-tool]').forEach(b => b.onclick = () => {
  tool = b.dataset.tool; if (tool !== 'move') sel = null;
  document.querySelectorAll('[data-tool]').forEach(x => x.setAttribute('aria-pressed', x === b));
  syncColors(); updateUI(); needsRender = true;
});
function syncColors(){
  const hl = tool === 'hl', c = hl ? hlColor : penColor;
  document.querySelectorAll('[data-color]').forEach(x => x.setAttribute('aria-pressed', x.dataset.color === c));
  document.querySelectorAll('.hlOnly').forEach(x => x.classList.toggle('hide', !hl));
}
document.querySelectorAll('[data-color]').forEach(b => b.onclick = () => {
  if (tool === 'hl'){ hlColor = b.dataset.color; syncColors(); return; }
  penColor = b.dataset.color;
  if (tool !== 'pen') document.querySelector('[data-tool="pen"]').click(); else syncColors();
});
document.querySelectorAll('[data-size]').forEach(b => b.onclick = () => {
  size = +b.dataset.size;
  document.querySelectorAll('[data-size]').forEach(x => x.setAttribute('aria-pressed', x === b));
});
$('undoBtn').onclick = undo; $('redoBtn').onclick = redo;
$('clearBtn').onclick = () => {
  const pg = page(); if (!pg.items.some(i => i.type === 'stroke')) return;
  snapshot(); pg.items = pg.items.filter(i => i.type !== 'stroke'); changed(); toast('手書きを消しました（元に戻すで復元できます）');
};
$('gridBtn').onclick = () => { grid = !grid; $('gridBtn').setAttribute('aria-pressed', grid); changed(); };
$('delImgBtn').onclick = () => { if (!sel) return; snapshot(); const pg = page(); pg.items = pg.items.filter(i => i !== sel); sel = null; changed(); };
function goTo(i){ cur = Math.max(0, Math.min(pages.length - 1, i)); sel = null; changed(); }
$('prevBtn').onclick = () => goTo(cur - 1);
$('nextBtn').onclick = () => goTo(cur + 1);
$('addBtn').onclick = () => { pages.splice(cur + 1, 0, newPage()); goTo(cur + 1); };
function armConfirm(btn, armedLabel, action){
  if (btn.dataset.armed){ clearTimeout(btn._t); btn.innerHTML = btn._orig; btn.classList.remove('danger'); delete btn.dataset.armed; action(); return; }
  btn._orig = btn.innerHTML; btn.dataset.armed = '1'; btn.textContent = armedLabel; btn.classList.add('danger');
  btn._t = setTimeout(() => { btn.innerHTML = btn._orig; btn.classList.remove('danger'); delete btn.dataset.armed; }, 3000);
}
$('delPageBtn').onclick = () => {
  if (page().items.length) armConfirm($('delPageBtn'), 'もう一度押すと削除', deletePage); else deletePage();
};
function deletePage(){
  if (pages.length === 1){ pages = [newPage()]; goTo(0); return; }
  pages.splice(cur, 1); goTo(Math.min(cur, pages.length - 1));
}
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z'){ e.preventDefault(); e.shiftKey ? redo() : undo(); }
  if (e.key === 'ArrowRight') goTo(cur + 1);
  if (e.key === 'ArrowLeft') goTo(cur - 1);
});
function updateUI(){
  $('pageLabel').textContent = `${cur + 1} / ${pages.length}`;
  $('prevBtn').disabled = cur === 0; $('nextBtn').disabled = cur === pages.length - 1;
  $('undoBtn').disabled = !page().undo.length; $('redoBtn').disabled = !page().redo.length;
  $('delImgBtn').classList.toggle('hide', !(sel && tool === 'move'));
}
let toastT;
function toast(msg, ms = 2600){ const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), ms); }

/* ---------- import ---------- */
$('importBtn').onclick = () => $('file').click();
$('file').onchange = async e => {
  const files = [...e.target.files]; e.target.value = '';
  for (const f of files){
    try {
      if (f.type === 'application/pdf' || /\.pdf$/i.test(f.name)) await importPdf(f);
      else await importImage(f);
    } catch (err){ console.error(err); toast(`${f.name} を読み込めませんでした`); }
  }
};
function fitRect(w, h, maxW, maxH){ const s = Math.min(maxW / w, maxH / h); return { w: w * s, h: h * s }; }
async function importImage(f){
  const url = URL.createObjectURL(f);
  const im = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
  const s = Math.min(1, 1800 / Math.max(im.naturalWidth, im.naturalHeight));
  const c = document.createElement('canvas'); c.width = Math.round(im.naturalWidth * s); c.height = Math.round(im.naturalHeight * s);
  const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(im, 0, 0, c.width, c.height);
  URL.revokeObjectURL(url);
  const src = c.toDataURL('image/jpeg', 0.88);
  const r = fitRect(c.width, c.height, W * 0.6, H * 0.7);
  snapshot();
  const item = { type: 'image', src, x: (W - r.w) / 2, y: (H - r.h) / 2, w: r.w, h: r.h, locked: false };
  page().items.push(item);
  document.querySelector('[data-tool="move"]').click(); sel = item; changed();
  toast('画像を貼りました。ドラッグで移動、右下の四角で拡大縮小できます');
}
async function importPdf(f){
  if (!window.pdfjsLib){ toast('PDFの読み込み機能を準備できませんでした'); return; }
  const data = new Uint8Array(await f.arrayBuffer());
  const pdf = await pdfjsLib.getDocument({ data }).promise;
  const insertAt = page().items.length ? cur + 1 : cur;
  const newPages = [];
  for (let n = 1; n <= pdf.numPages; n++){
    toast(`PDFを読み込み中 ${n} / ${pdf.numPages}`, 60000);
    const pg = await pdf.getPage(n);
    const v1 = pg.getViewport({ scale: 1 });
    const scale = Math.min(W / v1.width, H / v1.height) * 1.5;
    const vp = pg.getViewport({ scale });
    const c = document.createElement('canvas'); c.width = Math.round(vp.width); c.height = Math.round(vp.height);
    const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
    await pg.render({ canvasContext: g, viewport: vp }).promise;
    const src = c.toDataURL('image/jpeg', 0.9);
    const r = fitRect(c.width, c.height, W, H);
    const p = newPage(); p.items.push({ type: 'image', src, x: (W - r.w) / 2, y: (H - r.h) / 2, w: r.w, h: r.h, locked: true });
    newPages.push(p);
  }
  if (!page().items.length) pages.splice(cur, 1, ...newPages); else pages.splice(insertAt, 0, ...newPages);
  goTo(insertAt);
  toast(`PDF ${pdf.numPages}ページを追加しました`);
}

/* ---------- recording ---------- */
let recState = 'idle', rec = null, chunks = [], micStream = null, recBlob = null, recExt = 'mp4';
let elapsed = 0, lastTick = 0, timerId = null;
let recCanvas = null, rctx = null, recTrack = null, recFps = 30, lastFrameT = 0;
const QUALITY = {
  light: { w: 1280, h: 720,  fps: 30, vbr: 2000000 },
  std:   { w: 1920, h: 1080, fps: 30, vbr: 4000000 },
  high:  { w: 1920, h: 1080, fps: 60, vbr: 8000000 },
};
try { const q = localStorage.getItem('bansho-quality'); if (q && QUALITY[q]) $('quality').value = q; } catch (e){}
$('quality').onchange = () => { try { localStorage.setItem('bansho-quality', $('quality').value); } catch (e){} };
function fmt(ms){ const s = Math.floor(ms / 1000); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }
function tick(){ if (recState === 'live'){ const n = performance.now(); elapsed += n - lastTick; lastTick = n; } $('recTime').textContent = fmt(elapsed); }

$('recBtn').onclick = () => { if (recState === 'idle') startRec(); else stopRec(); };
$('pauseBtn').onclick = () => {
  if (!rec) return;
  if (recState === 'live'){ rec.pause(); recState = 'paused'; $('pauseBtn').innerHTML = '<svg viewBox="0 0 24 24"><path d="M7 5l12 7-12 7z"/></svg>再開'; toast('一時停止中'); }
  else if (recState === 'paused'){ rec.resume(); recState = 'live'; lastTick = performance.now(); $('pauseBtn').innerHTML = '<svg viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></svg>一時停止'; }
};

async function startRec(){
  if (!window.MediaRecorder || !cv.captureStream){ toast('このブラウザでは録画できません。iPadOSとSafariを最新にしてください', 4000); return; }
  recState = 'starting'; $('recBtn').disabled = true;
  micStream = null;
  let micMsg = '';
  let framed = false; try { framed = window.self !== window.top; } catch (e){ framed = true; }
  if (!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    micMsg = framed ? 'Claudeの画面内ではマイクを使えません' : 'https で始まるURLで開いていないため、マイクを使えません';
  } else {
    try {
      micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
    } catch (e){
      const n = e && e.name;
      micMsg = n === 'NotAllowedError' ? (framed ? 'Claudeの画面内ではマイクを使えません' : 'マイクが許可されていません。「ぁあ」→ Webサイトの設定 → マイク を確認してください')
        : n === 'NotFoundError' ? 'マイクが見つかりません'
        : n === 'NotReadableError' ? '別のアプリがマイクを使用中です'
        : `マイクを開始できませんでした（${n || '不明なエラー'}）`;
    }
  }
  if (micMsg) toast(micMsg + '。音声なしで録画します', 6000);
  const cd = $('countdown'); cd.style.display = 'flex';
  for (const n of [3, 2, 1]){ cd.textContent = n; await new Promise(r => setTimeout(r, 800)); }
  cd.style.display = 'none';
  const Q = QUALITY[$('quality').value] || QUALITY.std;
  recCanvas = document.createElement('canvas'); recCanvas.width = Q.w; recCanvas.height = Q.h;
  // Safari は画面に置かれていないキャンバスから映像を取り出せないため、見えない位置に配置する
  recCanvas.style.cssText = 'position:fixed;left:0;top:0;width:2px;height:2px;opacity:0.01;pointer-events:none;z-index:-1';
  document.body.appendChild(recCanvas);
  rctx = recCanvas.getContext('2d'); rctx.imageSmoothingQuality = 'high';
  rctx.drawImage(cv, 0, 0, Q.w, Q.h);
  let vs = recCanvas.captureStream(0);
  recTrack = vs.getVideoTracks()[0] || null;
  if (!recTrack || typeof recTrack.requestFrame !== 'function'){
    vs.getTracks().forEach(t => t.stop());
    vs = recCanvas.captureStream(Q.fps); recTrack = null;
  }
  recFps = Q.fps; lastFrameT = 0;
  const stream = new MediaStream([...vs.getVideoTracks(), ...(micStream ? micStream.getAudioTracks() : [])]);
  const mime = ['video/mp4;codecs=avc1,mp4a.40.2', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm'].find(m => MediaRecorder.isTypeSupported(m)) || '';
  recExt = /webm/.test(mime) ? 'webm' : 'mp4';
  try { rec = new MediaRecorder(stream, mime ? { mimeType: mime, videoBitsPerSecond: Q.vbr, audioBitsPerSecond: 128000 } : {}); }
  catch (e){ toast('録画を開始できませんでした'); cleanupRec(); return; }
  chunks = [];
  rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  rec.onstop = () => {
    recBlob = new Blob(chunks, { type: rec.mimeType || mime || 'video/mp4' });
    if (/webm/.test(recBlob.type)) recExt = 'webm';
    cleanupRec(); showResult();
  };
  rec.start(1000);
  recState = 'live'; elapsed = 0; lastTick = performance.now(); timerId = setInterval(tick, 250);
  $('recBtn').disabled = false; $('recBtn').classList.add('live'); $('recLabel').textContent = '停止';
  $('recTime').classList.remove('hide'); $('pauseBtn').classList.remove('hide'); $('quality').disabled = true;
}
function stopRec(){ if (rec && rec.state !== 'inactive') rec.stop(); }
function cleanupRec(){
  if (micStream) micStream.getTracks().forEach(t => t.stop()); micStream = null;
  clearInterval(timerId); recState = 'idle'; rec = null; if (recCanvas) recCanvas.remove(); recCanvas = null; rctx = null; recTrack = null; $('quality').disabled = false;
  $('recBtn').disabled = false; $('recBtn').classList.remove('live'); $('recLabel').textContent = '録画';
  $('recTime').classList.add('hide'); $('pauseBtn').classList.add('hide');
  $('pauseBtn').innerHTML = '<svg viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></svg>一時停止';
}
let videoURL = null;
function showResult(){
  if (videoURL) URL.revokeObjectURL(videoURL);
  videoURL = URL.createObjectURL(recBlob);
  $('resultVideo').src = videoURL; $('saveNote').classList.add('hide');
  $('resultDlg').showModal();
}
$('discardBtn').onclick = () => armConfirm($('discardBtn'), 'もう一度押すと破棄', () => {
  $('resultVideo').removeAttribute('src'); $('resultVideo').load(); recBlob = null; $('resultDlg').close();
});
$('saveBtn').onclick = async () => {
  const note = $('saveNote');
  const d = new Date(), z = n => String(n).padStart(2, '0');
  const name = `板書_${d.getFullYear()}${z(d.getMonth()+1)}${z(d.getDate())}_${z(d.getHours())}${z(d.getMinutes())}.${recExt}`;
  // 1) Claude上で開いている場合
  let dl = null;
  try { dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (e){ dl = null; }
  if (dl){
    try { await dl.save({ filename: name, data: recBlob }); toast('動画を保存しました'); }
    catch (err){ if (!err || err.code !== 'declined'){ note.textContent = '保存できませんでした。もう一度お試しください。'; note.classList.remove('hide'); } }
    return;
  }
  // 2) iPad・iPhone：共有シートから「ビデオを保存」
  const file = new File([recBlob], name, { type: recBlob.type || (recExt === 'webm' ? 'video/webm' : 'video/mp4') });
  if (navigator.canShare && navigator.canShare({ files: [file] })){
    try { await navigator.share({ files: [file] }); return; }
    catch (err){ if (err && err.name === 'AbortError') return; }
  }
  // 3) パソコンなど：通常のダウンロード
  try {
    const a = document.createElement('a'); a.href = videoURL; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    toast('動画をダウンロードしました');
  } catch (e){
    note.textContent = '保存できませんでした。動画の再生画面を長押しして保存してください。'; note.classList.remove('hide');
  }
};

/* ---------- autosave (IndexedDB) ---------- */
let dbP = null;
function openDB(){
  if (!dbP) dbP = new Promise((res, rej) => {
    const r = indexedDB.open('bansho-recorder', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  return dbP;
}
let saveT;
function scheduleSave(){ clearTimeout(saveT); saveT = setTimeout(saveNow, 800); }
async function saveNow(){
  try {
    const db = await openDB();
    const data = { pages: pages.map(p => ({ items: p.items })), cur, grid };
    await new Promise((res, rej) => { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(data, 'project'); tx.oncomplete = res; tx.onerror = () => rej(tx.error); });
  } catch (e){ /* storage unavailable: keep working in memory */ }
}
async function load(){
  try {
    const db = await openDB();
    const data = await new Promise((res, rej) => { const r = db.transaction('kv').objectStore('kv').get('project'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
    if (data && data.pages && data.pages.length){
      pages = data.pages.map(p => ({ items: p.items || [], undo: [], redo: [] }));
      cur = Math.min(data.cur || 0, pages.length - 1); grid = !!data.grid;
      $('gridBtn').setAttribute('aria-pressed', grid);
    }
  } catch (e){}
  layerDirty = needsRender = true; updateUI();
}

fit(); updateUI(); load(); requestAnimationFrame(loop);
})();
</script>
</body>
